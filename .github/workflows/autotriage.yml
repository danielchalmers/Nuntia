name: AutoTriage

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AutoTriage@v4 predates Claude support, so this follows main until the next major version is tagged.
      - uses: danielchalmers/AutoTriage@main
        with:
          issues: ${{ github.event.pull_request.number || github.event.issue.number }}
          model-pro: claude-opus-5-5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
