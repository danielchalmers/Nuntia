name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fork and Dependabot PRs don't receive repository secrets, so the live release-notes step is skipped for them.
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck tests
        run: npm run typecheck:test
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify dist/ is up to date
        run: npm run check:dist
      - name: Mock release notes
        if: env.HAS_GEMINI_KEY == 'true'
        uses: ./
        with:
          base-commit: ${{ github.sha }}
          head-commit: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          prompt-url: "https://raw.githubusercontent.com/danielchalmers/Nuntia/${{ github.sha }}/examples/Nuntia.prompt"
          model: "gemini-3.5-flash-lite"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Upload artifacts
        if: env.HAS_GEMINI_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error
