name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify dist/ is up to date
        run: npm run check:dist
      - name: Diagnose dist drift
        if: failure()
        run: |
          git show HEAD:dist/index.js > "$RUNNER_TEMP/committed.js"
          node -e '
            const fs=require("fs");
            const a=fs.readFileSync(process.env.RUNNER_TEMP+"/committed.js");
            const b=fs.readFileSync("dist/index.js");
            console.log("committed",a.length,"fresh",b.length,"delta",b.length-a.length);
            const n=Math.min(a.length,b.length); let i=0;
            while(i<n && a[i]===b[i]) i++;
            console.log("first diff at byte",i);
            const s=Math.max(0,i-160),e=i+160;
            console.log("COMMITTED:",JSON.stringify(a.slice(s,e).toString("latin1")));
            console.log("FRESH    :",JSON.stringify(b.slice(s,e).toString("latin1")));
          '
      - name: Mock release notes
        uses: ./
        with:
          base-commit: ${{ github.sha }}
          head-commit: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          prompt-url: "https://raw.githubusercontent.com/danielchalmers/Nuntia/${{ github.sha }}/examples/Nuntia.prompt"
          model: "gemini-2.5-flash"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ci-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error
