name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error title=dist is out of date::The committed dist/ does not match a fresh build. Run 'npm run build' and commit the changes in dist/."
            echo "Drifted paths:"
            git status --porcelain -- dist
            echo "Diff:"
            git --no-pager diff -- dist
            exit 1
          fi
          echo "dist/ is in sync with src/."
      - name: Mock release notes
        uses: ./
        with:
          base-commit: ${{ github.sha }}
          head-commit: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          prompt-url: "https://raw.githubusercontent.com/danielchalmers/Nuntia/${{ github.sha }}/examples/Nuntia.prompt"
          model: "gemini-2.5-flash"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ci-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error
