name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify dist/ is up to date
        run: npm run check:dist
      # The action only runs on release events, so synthesize one whose "tag" is this CI commit:
      # the smoke test diffs the latest published release against this commit — or takes the
      # first-release path while the repository has no published releases yet.
      # The bundle is invoked with `node` rather than `uses: ./` because the runner re-applies its
      # own reserved GITHUB_* variables on action steps, which would clobber the GITHUB_EVENT_PATH
      # override; inputs are passed the same way the runner does, as INPUT_* variables.
      - name: Mock release notes
        run: |
          printf '{"release": {"tag_name": "%s", "target_commitish": "%s", "published_at": "%s", "prerelease": true}}' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/release-event.json"
          env "GITHUB_EVENT_PATH=$RUNNER_TEMP/release-event.json" \
              "INPUT_PROMPT-URL=https://raw.githubusercontent.com/danielchalmers/Nuntia/$GITHUB_SHA/examples/Nuntia.prompt" \
              "INPUT_MODEL=gemini-3.1-flash-lite" \
              node dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error
