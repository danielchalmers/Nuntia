name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify dist/ is up to date
        run: npm run check:dist
      # Outside a release, Nuntia previews the next release: the commits after the latest release (or the newest tag) up to this commit.
      - name: Limit mock release-notes range
        id: mock-range
        run: echo "base=$(git rev-list --max-count=1 --skip=20 "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Mock release notes
        uses: ./
        with:
          model: claude-haiku-5-5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NUNTIA_PREVIEW_BASE: ${{ steps.mock-range.outputs.base }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error
