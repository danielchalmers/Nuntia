# Nuntia — AI-authored release notes on every published release.
#
# Setup (once):
#   1. Copy this file to .github/workflows/nuntia.yml in your repo.
#   2. Add a GEMINI_API_KEY repository secret (https://aistudio.google.com/apikey).
#      GITHUB_TOKEN is provided automatically — you don't add it.
#
# Then just publish a GitHub release. Nuntia reads the release you published, works out what
# changed since your previous release, and writes the notes to the workflow run summary and a
# downloadable artifact. Don't like them? Open the run and choose "Re-run jobs" to regenerate.
#
# Docs: https://github.com/danielchalmers/Nuntia
name: Nuntia

on:
  release:
    types: [published]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: danielchalmers/Nuntia@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: artifacts
          if-no-files-found: error
