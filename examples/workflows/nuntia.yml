name: Nuntia (Release Notes)

on:
  release:
    types: [published]

jobs:
  release-notes:
    runs-on: ubuntu-latest
    permissions:
      # contents: write is required by GitHub's generate-notes API, which Nuntia uses to find the
      # previous release. Nuntia itself never writes anything — not even your release.
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Generate release notes
        uses: danielchalmers/Nuntia@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuntia-release-notes-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error
