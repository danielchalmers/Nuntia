name: "Nuntia"
description: "Generate release notes and migration guides from a commit range on demand."
author: "Daniel Chalmers"
branding:
  color: "green"
  icon: "file-text"

inputs:
  # On the `release: published` event, Nuntia reads the tag and branch from the release itself and
  # diffs against the previous release — no inputs needed. base-commit/head-commit are the fallback
  # for running over an arbitrary commit range outside a release.
  base-commit:
    description: "Start commit SHA/ref (inclusive). Only for running over an explicit range instead of a release."
    required: false
  head-commit:
    description: "End commit SHA/ref (inclusive). Only for running over an explicit range instead of a release."
    required: false
  branch:
    description: "Branch name for the notes metadata (or owner/repo@branch to target another repo). Only used with base/head."
    required: false
  prompt-url:
    description: "URL for the prompt template. Leave blank to use Nuntia's built-in prompt."
    required: false
    default: "https://raw.githubusercontent.com/danielchalmers/Nuntia/refs/heads/main/examples/Nuntia.prompt"
  model:
    description: "Gemini model identifier used to generate release notes."
    required: false
    default: "gemini-3.5-flash"
  max-linked-items:
    description: "Cap on how many linked issues, PRs, or commits are fetched."
    required: false
    default: "5"
  max-reference-depth:
    description: "Depth to follow references inside linked descriptions."
    required: false
    default: "2"
  max-item-length:
    description: "Maximum length for each commit message and linked item title/body field."
    required: false
    default: "5000"

outputs:
  release-notes-path:
    description: "Filesystem path to the generated release notes markdown."
  input-tokens:
    description: "Gemini input token count."
  output-tokens:
    description: "Gemini output token count."

runs:
  using: "node24"
  main: "dist/index.js"
